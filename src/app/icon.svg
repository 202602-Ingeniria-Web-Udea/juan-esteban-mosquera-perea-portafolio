<!-- Logotipo "Prompt MJ": el › de la terminal es la M y la J lleva un travesaño que a la vez es el cursor.
     Retícula de 48 unidades, trazo de 4 y compensación óptica en el vértice y la curva. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="10.5" fill="#0d1321"/>
  <rect x=".75" y=".75" width="46.5" height="46.5" rx="9.75" fill="none" stroke="#748cab" stroke-opacity=".35" stroke-width="1"/>
  
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 13 L21.5 24 L11 35" stroke="#748cab"/>
      <path d="M33 15 V28 a7 7 0 0 1 -7 7 h-0.5" stroke="#f0ebd8"/>
      <rect x="27" y="11" width="12" height="4" rx="2" fill="#f0ebd8" stroke="none"/></g>
</svg>